<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FLAG ARENA WORLD CHAMPIONSHIP — 24/7 Broadcast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  :root{
    --bg-0:#05070d; --bg-1:#0a0e18;
    --panel-0:#0d1220; --panel-1:#0a0e18; --line:#20283e;
    --gold:#e8b94b; --white:#eef2f8; --mist:#8b96b3;
    --cyan:#5fe0f0; --pink:#e8828c; --green-tick:#3ecf8e; --red:#e4483c;
    --shadow:rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(1px 1px at 8% 12%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 22% 68%, rgba(255,255,255,.35), transparent),
      radial-gradient(1.5px 1.5px at 38% 22%, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 55% 82%, rgba(255,255,255,.3), transparent),
      radial-gradient(1.5px 1.5px at 72% 15%, rgba(255,255,255,.45), transparent),
      radial-gradient(1px 1px at 85% 55%, rgba(255,255,255,.3), transparent),
      radial-gradient(1px 1px at 92% 88%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.5px 1.5px at 15% 90%, rgba(255,255,255,.3), transparent),
      radial-gradient(1px 1px at 65% 45%, rgba(255,255,255,.25), transparent),
      radial-gradient(ellipse 900px 700px at 50% 40%, rgba(95,224,240,.05), transparent 60%),
      var(--bg-0);
    color:var(--white); font-family:'Inter',sans-serif; height:100%;
  }
  .display{font-family:'Teko',sans-serif; letter-spacing:.02em;}

  /* Fixed 9:16 (YouTube Shorts / TikTok) frame — letterboxed within whatever
     window or capture area it's placed in, rather than stretching to fill
     it. Whichever dimension is the limiting one, the other is derived from
     the 9:16 ratio, so the frame is always exactly portrait-video shaped. */
  .shell{
    aspect-ratio: 9 / 16;
    width: min(100vw, 100vh * 9 / 16);
    height: min(100vh, 100vw * 16 / 9);
    margin: auto;
    display:flex; flex-direction:column; gap:8px;
    padding:10px 12px; overflow:hidden;
    container-type: size; container-name: frame;
  }

  /* ---------- TOP BAR ---------- */
  .topbar{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .pill{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:5px 14px; border-radius:10px; background:var(--panel-0);
    border:1px solid var(--line); box-shadow:0 4px 12px var(--shadow); min-width:64px;
  }
  .pill-label{font-size:8px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--mist);}
  .pill-val{font-family:'Teko',sans-serif; font-size:19px; font-weight:600; color:var(--white); line-height:1.1; white-space:nowrap;}
  .pill-globe{flex-direction:row; gap:6px;}
  .pill-globe .pill-val{font-size:16px; color:var(--cyan);}
  .topbar .spacer{flex:1;}
  .icon-btn{
    flex-shrink:0; width:34px; height:34px; border-radius:10px;
    background:var(--panel-0); border:1px solid var(--line); color:var(--cyan); font-size:14px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:active{transform:scale(.92);}
  .icon-btn.muted{color:var(--mist); opacity:.6;}

  /* ---------- PROGRESS BAR ---------- */
  .progress-track{
    position:relative; height:6px; border-radius:4px; background:#111826; flex-shrink:0;
    border:1px solid var(--line); overflow:hidden;
  }
  .progress-fill{
    height:100%; width:0%; border-radius:4px;
    background:linear-gradient(90deg, var(--green-tick), var(--gold));
    transition:width .4s ease;
  }
  .progress-tick{position:absolute; top:50%; width:3px; height:3px; background:rgba(255,255,255,.5); transform:translateY(-50%); border-radius:1px;}

  /* ---------- ARENA ---------- */
  .arena-outer{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; position:relative;}
  .arena-outer::before{
    content:''; position:absolute; inset:-6%; border-radius:50%; pointer-events:none;
    background:
      repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 34px, rgba(95,224,240,.035) 35px, transparent 36px);
    opacity:.7;
  }
  .arena-wrap{
    position:relative; border-radius:50%; overflow:hidden;
  }
  canvas{display:block; width:100%; height:100%;}

  .banner{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(.7);
    text-align:center; pointer-events:none; opacity:0; transition:opacity .25s ease, transform .25s ease; z-index:5;
  }
  .banner.show{opacity:1; transform:translate(-50%,-50%) scale(1);}
  .banner .display{font-size:clamp(26px,5.6vw,48px); font-weight:700; color:var(--white); text-transform:uppercase; text-shadow:0 6px 24px rgba(0,0,0,.7);}
  .banner .sub{font-size:11px; letter-spacing:.2em; color:var(--gold); text-transform:uppercase; margin-top:-6px; text-shadow:0 2px 8px rgba(0,0,0,.7);}

  .overlay{
    position:absolute; inset:0; z-index:10; background:rgba(5,7,13,.9); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; padding:20px; border-radius:50%;
  }
  .overlay.hidden{display:none;}
  .card{width:100%; max-width:340px; text-align:center;}
  .card h2{font-family:'Teko',sans-serif; font-size:clamp(26px,5.6vw,38px); font-weight:700; margin:0 0 4px; text-transform:uppercase;}
  .card p.lede{color:var(--mist); font-size:11px; margin:0 0 4px;}
  .champ-flag{width:100px; height:70px; object-fit:cover; border-radius:9px; margin:0 auto 12px;
    box-shadow:0 12px 34px rgba(0,0,0,.5), 0 0 0 4px var(--panel-0), 0 0 0 6px var(--gold);}

  @keyframes fall{to{transform:translateY(380px) rotate(360deg); opacity:0;}}

  /* ---------- WATERMARK ---------- */
  .watermark{
    text-align:center; flex-shrink:0; font-size:13px; font-weight:600; letter-spacing:.02em;
    color:rgba(255,255,255,.16); margin-top:-4px;
  }

  /* ---------- BOTTOM PANELS ---------- */
  .panels-row{display:flex; gap:8px; flex-shrink:0;}
  .panel{
    flex:1; min-width:0; background:linear-gradient(180deg, var(--panel-0), var(--panel-1));
    border:1px solid var(--line); border-radius:12px; padding:9px 10px;
    display:flex; flex-direction:column; box-shadow:0 6px 16px var(--shadow);
  }
  .panel-head{display:flex; align-items:center; gap:6px; margin-bottom:4px; flex-shrink:0;}
  .panel-icon{font-size:12px;}
  .panel-head h4{margin:0; font-family:'Teko',sans-serif; font-size:15px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; color:var(--white); white-space:nowrap;}
  .panel-count{
    margin-left:auto; font-size:10px; font-weight:800; letter-spacing:.03em;
    padding:2px 8px; border-radius:9px; background:rgba(232,185,75,.14); color:var(--gold); white-space:nowrap;
  }
  .wc-sub{text-align:center; margin-bottom:4px; flex-shrink:0;}
  .wc-stage{font-family:'Teko',sans-serif; font-size:16px; font-weight:600; letter-spacing:.03em; color:var(--white); text-transform:uppercase;}
  .wc-tag{font-size:9.5px; font-weight:700; letter-spacing:.04em; color:var(--gold); text-transform:uppercase; margin-top:-2px;}
  .panel-body{overflow-y:auto; max-height:118px; font-size:10.5px;}
  .panel-body::-webkit-scrollbar{width:4px;}
  .panel-body::-webkit-scrollbar-thumb{background:#26314a; border-radius:3px;}

  .row-line{display:flex; align-items:center; gap:6px; padding:3.5px 2px; border-bottom:1px solid #182238;}
  .row-line:last-child{border-bottom:none;}
  .row-line img{width:16px; height:12px; object-fit:cover; border-radius:2px; flex-shrink:0; box-shadow:0 0 0 1px rgba(255,255,255,.15);}
  .row-line .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row-line .rk{width:20px; font-size:9.5px; color:var(--mist); font-weight:700; flex-shrink:0;}
  .row-line .chk{color:var(--green-tick); font-size:11px; flex-shrink:0;}

  /* ---------- PROPORTIONAL SCALING ----------
     Everything above uses fixed px sizes tuned for one particular window
     size — that's exactly why it looked fine at one browser zoom level but
     cramped or overflowing at another. These rules re-express the same
     elements as a percentage of the frame's own rendered size (via CSS
     container query units), so the whole UI scales together no matter how
     big or small the 9:16 frame ends up being. Browsers without container
     query unit support simply ignore these (invalid unit = whole
     declaration dropped) and keep the fixed px versions above. */
  .pill{ min-width: clamp(44px, 15cqw, 70px); padding: clamp(4px, 1cqh, 6px) clamp(8px, 3.6cqw, 15px); }
  .pill-label{ font-size: clamp(6.5px, 1cqh, 9px); }
  .pill-val{ font-size: clamp(13px, 2.4cqh, 20px); }
  .pill-globe .pill-val{ font-size: clamp(11px, 2cqh, 17px); }
  .icon-btn{ width: clamp(24px, 8.5cqw, 36px); height: clamp(24px, 4.4cqh, 36px); font-size: clamp(10px, 3.6cqw, 15px); }
  .topbar{ gap: clamp(4px, 1.8cqw, 9px); }
  .progress-track{ height: clamp(4px, 0.8cqh, 7px); }
  .panel-head h4{ font-size: clamp(11px, 1.8cqh, 16px); }
  .panel-count{ font-size: clamp(8px, 1.15cqh, 11px); }
  .wc-stage{ font-size: clamp(12px, 1.9cqh, 17px); }
  .wc-tag{ font-size: clamp(7.5px, 1.05cqh, 10px); }
  .panel-body{ max-height: clamp(60px, 15cqh, 160px); font-size: clamp(9px, 1.2cqh, 11px); }
  .panel{ padding: clamp(6px, 1.1cqh, 10px) clamp(7px, 2.8cqw, 11px); }
  .panels-row{ gap: clamp(5px, 1.8cqw, 9px); }
  .row-line img{ width: clamp(13px, 4cqw, 17px); height: clamp(10px, 3cqw, 13px); }
  .watermark{ font-size: clamp(10px, 1.5cqh, 14px); }
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="pill"><div class="pill-label">Cup</div><div class="pill-val" id="cupNum">1</div></div>
    <div class="pill"><div class="pill-label">Stage</div><div class="pill-val" id="stageVal" style="font-size:14px;">Loading</div></div>
    <div class="pill pill-globe">🌐<div class="pill-val" id="matchNum">0/37</div></div>
    <div class="spacer"></div>
    <button id="soundToggle" class="icon-btn" title="Toggle sound">🔊</button>
    <button id="settingsToggle" class="icon-btn" title="Toggle announcer voice">⚙️</button>
  </div>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="arena-outer">
    <div class="arena-wrap" id="arenaWrap">
      <canvas id="arena"></canvas>
      <div class="banner" id="banner">
        <div class="display" id="bannerText">LOADING</div>
        <div class="sub" id="bannerSub">Please wait</div>
      </div>
      <div class="overlay hidden" id="champOverlay">
        <div class="card">
          <div class="sub" style="color:var(--gold); letter-spacing:.3em; font-size:11px; margin-bottom:8px;">WORLD CHAMPION</div>
          <img class="champ-flag" id="champFlag" src="" alt="">
          <h2 id="champName">—</h2>
          <p class="lede" id="champStat">—</p>
          <p class="lede">Next tournament begins shortly…</p>
        </div>
      </div>
    </div>
  </div>

  <div class="watermark">@WorldFlagsCup</div>

  <div class="panels-row">
    <div class="panel">
      <div class="panel-head"><span class="panel-icon">🌐</span><h4>World Cup</h4></div>
      <div class="wc-sub">
        <div class="wc-stage" id="wcStage">PLAY-IN</div>
        <div class="wc-tag" id="wcTag">SUMO WINNERS ✓</div>
      </div>
      <div class="panel-body" id="worldCupList"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><span class="panel-icon">⚔</span><h4>Contenders</h4><span class="panel-count" id="contendersCount">88</span></div>
      <div class="panel-body" id="contendersList"></div>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  // =========================================================
  // DATA
  // =========================================================
  const CONTINENTS = [
    { name:'Africa', quota:7, list:[
      ['ng','Nigeria'],['eg','Egypt'],['za','South Africa'],['ke','Kenya'],['gh','Ghana'],
      ['ma','Morocco'],['dz','Algeria'],['et','Ethiopia'],['tz','Tanzania'],['ug','Uganda'],
      ['cm','Cameroon'],['ci','Ivory Coast'],['sn','Senegal'],['tn','Tunisia'],['ao','Angola'],
      ['mz','Mozambique'],['zm','Zambia'],['zw','Zimbabwe'],['rw','Rwanda'],['mg','Madagascar']
    ]},
    { name:'Asia', quota:7, list:[
      ['cn','China'],['in','India'],['jp','Japan'],['kr','South Korea'],['id','Indonesia'],
      ['sa','Saudi Arabia'],['ae','UAE'],['tr','Turkey'],['th','Thailand'],['vn','Vietnam'],
      ['ph','Philippines'],['pk','Pakistan'],['bd','Bangladesh'],['ir','Iran'],['iq','Iraq'],
      ['il','Israel'],['my','Malaysia'],['sg','Singapore'],['kz','Kazakhstan'],['mn','Mongolia']
    ]},
    { name:'Europe', quota:7, list:[
      ['de','Germany'],['fr','France'],['gb','United Kingdom'],['it','Italy'],['es','Spain'],
      ['nl','Netherlands'],['pt','Portugal'],['se','Sweden'],['no','Norway'],['dk','Denmark'],
      ['fi','Finland'],['pl','Poland'],['ch','Switzerland'],['at','Austria'],['be','Belgium'],
      ['ie','Ireland'],['gr','Greece'],['cz','Czechia'],['hu','Hungary'],['ro','Romania']
    ]},
    { name:'North America', quota:4, list:[
      ['us','USA'],['ca','Canada'],['mx','Mexico'],['cu','Cuba'],['jm','Jamaica'],
      ['cr','Costa Rica'],['pa','Panama'],['gt','Guatemala'],['hn','Honduras'],['do','Dominican Republic']
    ]},
    { name:'South America', quota:4, list:[
      ['br','Brazil'],['ar','Argentina'],['cl','Chile'],['co','Colombia'],['pe','Peru'],
      ['uy','Uruguay'],['ve','Venezuela'],['ec','Ecuador'],['py','Paraguay'],['bo','Bolivia']
    ]},
    { name:'Oceania', quota:3, list:[
      ['au','Australia'],['nz','New Zealand'],['fj','Fiji'],['pg','Papua New Guinea'],
      ['ws','Samoa'],['to','Tonga'],['vu','Vanuatu'],['sb','Solomon Islands']
    ]}
  ];
  const flagUrl = (code,size) => `https://flagcdn.com/${size||'w80'}/${code}.png`;
  const TOTAL_MATCHES = CONTINENTS.length + 31; // 6 play-ins + 31 bracket matches
  const MAX_HP = 300; // 3x the original pool so play-ins last well beyond a few seconds

  // =========================================================
  // FIGHTER REGISTRY
  // =========================================================
  function Fighter(code, name, continent){
    this.code = code; this.name = name; this.continent = continent;
    this.img = new Image(); this.img.crossOrigin = 'anonymous'; this.img.src = flagUrl(code,'w160');
    this.iconSmall = flagUrl(code,'w40');
    this.hp = MAX_HP; this.maxHp = MAX_HP; this.alive = true; this.status = 'idle';
    this.winCount = 0; this.flashT = 0; this.body = null; this.ringOut = false;
    this.champCount = 0; // tournaments actually WON — persists across resets, unlike winCount
  }
  Fighter.prototype.reset = function(){
    this.hp = MAX_HP; this.maxHp = MAX_HP; this.alive = true; this.status = 'idle'; this.winCount = 0;
    this.flashT = 0; this.body = null; this.ringOut = false;
    // champCount is intentionally left untouched — it's the all-time record.
  };
  Fighter.prototype.spawnBody = function(x,y,opts){
    opts = opts || {};
    this.maxHp = opts.hp || MAX_HP; this.hp = this.maxHp; this.alive = true; this.flashT = 0; this.ringOut = false;
    const angle = opts.angle != null ? opts.angle : Math.random()*Math.PI*2;
    const speed = opts.speed != null ? opts.speed : (2.6 + Math.random()*2.2);
    this.body = Bodies.circle(x, y, currentFighterR, {
      restitution:0.9, friction:0.001, frictionAir: opts.frictionAir != null ? opts.frictionAir : 0.0018,
      density:0.002, label:'fighter:'+this.code
    });
    Body.setVelocity(this.body, {x:Math.cos(angle)*speed, y:Math.sin(angle)*speed});
    Body.setAngularVelocity(this.body, (Math.random()-0.5)*0.08);
    World.add(engine.world, this.body);
  };
  Fighter.prototype.removeBody = function(){
    if(this.body){ World.remove(engine.world, this.body); this.body = null; }
  };

  const registry = {};
  CONTINENTS.forEach(cont=>{
    cont.list.forEach(([code,name])=>{ registry[code] = new Fighter(code, name, cont.name); });
  });
  const ALL_FIGHTERS = Object.values(registry);

  // =========================================================
  // SOUND — procedural SFX (Web Audio) + announcer voice (Speech Synthesis)
  // Both are generated in-browser, so no audio files need to be hosted.
  // =========================================================
  let soundOn = true;
  let announcerOn = true;
  let audioCtx = null;
  function getCtx(){
    if(!window.AudioContext && !window.webkitAudioContext) return null;
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    return audioCtx;
  }
  function tone(freq, dur, type, gain, delay, endFreq){
    if(!soundOn) return;
    const ctx = getCtx(); if(!ctx) return;
    if(ctx.state === 'suspended') ctx.resume();
    const t0 = ctx.currentTime + (delay||0);
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if(endFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(1,endFreq), t0+dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(gain||0.15, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+dur+0.03);
  }
  let lastHitSfx = 0;
  function sfxHit(){
    const now = performance.now();
    if(now - lastHitSfx < 90) return; // throttle so crowded rumbles don't wall-of-noise
    lastHitSfx = now;
    tone(120+Math.random()*50, 0.06, 'square', 0.07);
  }
  function sfxEliminate(){ tone(420, 0.26, 'sawtooth', 0.11, 0, 90); }
  function sfxStart(){ tone(440,0.1,'sine',0.09); tone(660,0.12,'sine',0.09,0.1); }
  function sfxWin(){ tone(660,0.1,'triangle',0.11); tone(880,0.16,'triangle',0.11,0.1); }
  function sfxChampion(){
    tone(523,0.16,'triangle',0.13); tone(659,0.16,'triangle',0.13,0.16);
    tone(784,0.16,'triangle',0.13,0.32); tone(1046,0.34,'triangle',0.15,0.48);
  }

  // ---- Announcer voice ----
  let voices = [], chosenVoice = null, unlockedSpeech = false;
  const speechSupported = 'speechSynthesis' in window;
  function loadVoices(){
    if(!speechSupported) return;
    voices = speechSynthesis.getVoices();
    if(voices.length) chosenVoice = voices.find(v=>/en-?(US|GB)/i.test(v.lang)) || voices[0];
  }
  if(speechSupported){
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }
  let speechQueue = [], isSpeaking = false;
  function pumpSpeechQueue(){
    if(!speechSupported || isSpeaking || speechQueue.length===0) return;
    const text = speechQueue.shift();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.05; u.pitch = 0.92; u.volume = 1;
    if(chosenVoice) u.voice = chosenVoice;
    let settled = false;
    const finish = ()=>{ if(settled) return; settled = true; isSpeaking = false; pumpSpeechQueue(); };
    u.onend = finish;
    u.onerror = finish;
    isSpeaking = true;
    try{
      if(speechSynthesis.paused) speechSynthesis.resume();
      speechSynthesis.speak(u);
    }catch(e){ finish(); return; }
    // Safety net: some browsers/webviews never reliably fire onend, which
    // would otherwise jam the queue permanently. Force it clear after a
    // generous timeout based on the text length.
    setTimeout(finish, Math.max(1500, text.length * 80));
  }
  function announce(text){
    if(!soundOn || !announcerOn || !speechSupported) return;
    speechQueue.push(text);
    if(speechQueue.length > 3) speechQueue.shift(); // don't let a backlog build up and lag behind the action
    pumpSpeechQueue();
  }
  // Chrome has a long-standing bug where speechSynthesis silently stops
  // producing audio after ~15s idle unless nudged — a cheap periodic
  // resume() keeps the engine alive for a broadcast that runs for hours.
  if(speechSupported){
    setInterval(()=>{ try{ speechSynthesis.resume(); }catch(e){} }, 4000);
  }

  function unlockAudio(){
    try{ const ctx = getCtx(); if(ctx && ctx.state==='suspended') ctx.resume(); }catch(e){}
    try{
      if(speechSupported && !unlockedSpeech){
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0;
        speechSynthesis.speak(u);
        unlockedSpeech = true;
      }
    }catch(e){}
  }
  document.addEventListener('pointerdown', function onFirstInteract(){
    unlockAudio();
    document.removeEventListener('pointerdown', onFirstInteract);
  }, {once:true});

  const soundToggleBtn = document.getElementById('soundToggle');
  soundToggleBtn.addEventListener('click', ()=>{
    soundOn = !soundOn;
    soundToggleBtn.textContent = soundOn ? '🔊' : '🔇';
    soundToggleBtn.classList.toggle('muted', !soundOn);
    if(!soundOn){
      if(speechSupported) speechSynthesis.cancel();
      speechQueue = []; isSpeaking = false;
    } else {
      unlockAudio();
      tone(440,0.12,'sine',0.14);
      // Speak directly (not via the queue) so this happens synchronously
      // inside the click gesture — the most reliable way to confirm/unlock
      // voice on strict platforms like iOS Safari.
      if(speechSupported && announcerOn){
        try{
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance('Sound on');
          u.rate = 1.05; u.volume = 1;
          if(chosenVoice) u.voice = chosenVoice;
          speechSynthesis.speak(u);
        }catch(e){}
      }
    }
  });

  // Settings (gear) button: toggles the announcer's voice only, leaving
  // sound effects on — a lighter-touch control than the master mute.
  const settingsToggleBtn = document.getElementById('settingsToggle');
  settingsToggleBtn.addEventListener('click', ()=>{
    announcerOn = !announcerOn;
    settingsToggleBtn.classList.toggle('muted', !announcerOn);
    settingsToggleBtn.title = announcerOn ? 'Toggle announcer voice' : 'Announcer voice muted';
    if(!announcerOn && speechSupported){ speechSynthesis.cancel(); speechQueue = []; isSpeaking = false; }
  });

  // =========================================================
  // MATTER.JS SETUP  (no wall bodies — boundary handled manually each frame)
  // =========================================================
  const { Engine, World, Bodies, Body, Vector } = Matter;
  const engine = Engine.create();
  engine.world.gravity.x = 0; engine.world.gravity.y = 0;

  const SIZE = 800, CX = 400, CY = 400;
  // Arena is now a FIXED size matching the Africa play-in (20 nations) —
  // it no longer shrinks for smaller matches. This keeps "distance to the
  // wall" meaningful and consistent for knockback tuning at every stage.
  const ARENA_FIXED_R = Math.round(Math.min(372, 210 + 20*8)); // = 370
  let currentArenaR = ARENA_FIXED_R, currentFighterR = 34;

  function fighterRadiusFor(n){ return Math.round(Math.max(16, 46 - Math.max(0,n-2)*1.15)); }

  function setupArenaFor(n){
    currentArenaR = ARENA_FIXED_R;
    currentFighterR = fighterRadiusFor(n);
  }

  function spawnRing(list){
    const n = list.length;
    const isDuel = n === 2;
    // Play-ins were taking twice as long as duels (2x HP) — halving that
    // back down to the same pool as a duel, so play-ins run half as long.
    const hp = MAX_HP;
    // Rumbles also start slower and lose speed faster between hits (higher
    // air friction) so a crowded play-in reads as a rumble, not a blur.
    // Duels get lower friction so a hard knockback can actually carry.
    const frictionAir = isDuel ? 0.0025 : 0.0032;

    if(isDuel){
      // Spawn the two duelists at opposite ends of a random diameter,
      // aimed straight at each other. Two independent random angles could
      // previously land them almost on top of one another (an immediate,
      // jarring collision right as the match started) or send them drifting
      // off in unrelated directions with nothing pulling them together.
      const theta = Math.random()*Math.PI*2;
      const rad = currentArenaR * 0.5;
      const chargeSpeed = 2.8 + Math.random()*0.8;
      list[0].status = 'battling';
      list[0].spawnBody(CX + Math.cos(theta)*rad, CY + Math.sin(theta)*rad,
        { frictionAir, hp, angle: theta + Math.PI, speed: chargeSpeed });
      list[1].status = 'battling';
      list[1].spawnBody(CX + Math.cos(theta+Math.PI)*rad, CY + Math.sin(theta+Math.PI)*rad,
        { frictionAir, hp, angle: theta, speed: chargeSpeed });
      return;
    }

    const speed = 1.2 + Math.random()*1.2;
    list.forEach((f,i)=>{
      const a = (i/n) * Math.PI*2 + (Math.random()-0.5)*0.2;
      const rad = currentArenaR * (0.4 + Math.random()*0.25);
      f.status = 'battling';
      f.spawnBody(CX + Math.cos(a)*rad, CY + Math.sin(a)*rad, { frictionAir, hp, speed });
    });
  }

  // Perfect circular boundary: reflect any fighter that pushes past the edge.
  // Position is nudged slightly *inside* the true edge (buffer) so a fighter
  // getting jostled by neighbours right at the wall doesn't re-trigger the
  // bounce every frame and appear "stuck". Used for play-in rumbles.
  function containFighter(f){
    if(!f.body || !f.alive) return;
    const p = f.body.position;
    const dx = p.x - CX, dy = p.y - CY;
    const dist = Math.hypot(dx,dy) || 0.0001;
    const maxDist = currentArenaR - currentFighterR;
    if(dist > maxDist){
      const nx = dx/dist, ny = dy/dist;
      const inset = maxDist - 3;
      Body.setPosition(f.body, {x: CX + nx*inset, y: CY + ny*inset});
      const v = f.body.velocity;
      const dot = v.x*nx + v.y*ny;
      const rest = 0.9;
      // Always send it back inward with a minimum kick, even if it arrived
      // nearly at rest (e.g. after being pinned by neighbours).
      const inward = Math.max(1.5, (1+rest)*dot);
      Body.setVelocity(f.body, {x: v.x - inward*nx, y: v.y - inward*ny});
      spawnBurst(f.body.position.x, f.body.position.y, '#3ecf8e', 4);
      shake = Math.min(6, shake + 1.2);
    }
  }

  // Ring-out check for 1v1 duels: no hard wall here — a big hit can send a
  // fighter sailing past the ring entirely. If it travels far enough past
  // the boundary, that's an instant knockout. Otherwise the ongoing centre
  // pull (applyDuelSteering) reels it back in for another clash.
  function checkRingOut(f){
    if(!f.body || !f.alive) return;
    const dx = f.body.position.x - CX, dy = f.body.position.y - CY;
    const dist = Math.hypot(dx,dy);
    const ringOutR = currentArenaR + currentFighterR*3;
    if(dist > ringOutR){
      f.ringOut = true;
      f.hp = 0; // shared elimination handling in the main loop takes it from here
    }
  }

  // =========================================================
  // MATCH RUNNER
  // =========================================================
  let activeFighters = [];
  let matchRunning = false;
  let matchTargetRemaining = 1;
  let matchResolve = null;
  let particles = [];
  let shake = 0;
  let eliminationOrder = []; // tracks who died, in order, during the current match

  function runMatch(list, targetRemaining){
    return new Promise(resolve=>{
      activeFighters = list;
      matchTargetRemaining = targetRemaining;
      eliminationOrder = [];
      setupArenaFor(list.length);
      spawnRing(list);
      matchRunning = true;
      // Live-update the Contenders count/list while the match is actually
      // running, not just at the discrete start/end of each match.
      const liveTimer = setInterval(refreshPanels, 400);
      matchResolve = (result)=>{ clearInterval(liveTimer); resolve(result); };
      refreshPanels();
    });
  }

  function fighterFromBody(body){
    if(!body.label || body.label.indexOf('fighter:') !== 0) return null;
    const code = body.label.split(':')[1];
    const f = registry[code];
    return (f && f.body === body) ? f : null;
  }

  // Knockback is queued here and applied once, right after the physics step
  // finishes for the frame (see loop()) — NOT immediately inside this event.
  // Matter fires 'collisionStart' before its own solver has resolved the
  // contact (restitution, overlap correction), so setting velocity here
  // directly could get partially overwritten or double-applied by the
  // solver's own response later in the same step — an inconsistent race
  // that showed up as jittery, unpredictable bounces, especially
  // noticeable in a 1-on-1 duel with only one collision to watch.
  let pendingKnockbacks = [];

  Matter.Events.on(engine, 'collisionStart', (event)=>{
    event.pairs.forEach(pair=>{
      const fa = fighterFromBody(pair.bodyA), fb = fighterFromBody(pair.bodyB);
      if(fa && fb){
        const rv = Vector.sub(pair.bodyA.velocity, pair.bodyB.velocity);
        const speed = Vector.magnitude(rv);
        const isDuelHit = activeFighters.length <= 2;
        // In a crowded play-in rumble, plenty of contact is just fighters
        // jostling past each other — only a hit above this speed counts as
        // real damage. Duels always deal damage, since every clash there is
        // a deliberate collision rather than incidental crowding.
        const dealsDamage = isDuelHit || speed >= 2.1;
        if(dealsDamage){
          const dmg = Math.max(3, Math.min(36, speed * 2.1));
          fa.hp -= dmg; fb.hp -= dmg;
          fa.flashT = 0.15; fb.flashT = 0.15;
        }
        const diff = Vector.sub(pair.bodyB.position, pair.bodyA.position);
        const dist = Vector.magnitude(diff) || 1;
        const normal = Vector.div(diff, dist);
        const mid = Vector.add(pair.bodyA.position, Vector.mult(diff, 0.5));
        spawnBurst(mid.x, mid.y, '#ffffff', Math.min(14, 4+speed));
        shake = Math.min(10, shake + speed*0.3);
        sfxHit();

        // Explicit knockback so a hit visibly launches both flags apart —
        // the ongoing centre-pull then reels them back in for the next clash.
        // Scaled by hit speed: a light graze only nudges a fighter toward the
        // wall, while a full-power collision sends them flying out to it.
        // This still applies even on a non-damaging graze, so a crowd still
        // visibly jostles apart without necessarily losing health.
        const speedFrac = Math.min(1, speed / 12); // 0 = grazing tap, 1 = full-power hit
        const kb = isDuelHit
          ? 5 + speedFrac * 29   // duels: light hit still nudges, hard hit rockets them clear to the wall
          : 1.6 + speedFrac * 6; // rumbles: calmer knockback so a crowded play-in doesn't feel frantic
        pendingKnockbacks.push({ bodyA: pair.bodyA, bodyB: pair.bodyB, normal, kb });
      }
    });
  });

  function spawnBurst(x,y,color,n){
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, s = 1+Math.random()*4;
      particles.push({x,y,vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, color, r:1.5+Math.random()*2.5});
    }
  }

  function checkMatchEnd(){
    if(!matchRunning) return;
    let alive = activeFighters.filter(f=>f.alive);
    if(alive.length <= matchTargetRemaining){
      matchRunning = false;
      // Guard against overshoot: if several fighters died in the very same
      // physics tick (common in a big rumble, or a mutual KO in a duel),
      // fewer than targetRemaining could be left alive. Top back up with
      // whoever was eliminated most recently so the caller always gets
      // exactly targetRemaining fighters back — otherwise downstream code
      // (bracket pairing) can end up with an odd, broken qualifier count.
      if(alive.length < matchTargetRemaining){
        const need = matchTargetRemaining - alive.length;
        const topUp = eliminationOrder.slice(-need).filter(f=>!alive.includes(f));
        alive = alive.concat(topUp);
      }
      const resolve = matchResolve; matchResolve = null;
      if(resolve) resolve(alive);
    }
  }

  // Play-in rumbles: gentle force-based nudge back toward centre, working
  // alongside the wall bounce so bodies don't park at the edge.
  function applyCenterPull(){
    activeFighters.forEach(f=>{
      if(!f.alive || !f.body) return;
      const dx = CX - f.body.position.x, dy = CY - f.body.position.y;
      const dist = Math.hypot(dx,dy) || 1;
      const nx = dx/dist, ny = dy/dist;
      const edgeZone = dist > currentArenaR*0.55;
      const mag = edgeZone ? 0.0011 : 0.00022;
      Body.applyForce(f.body, f.body.position, {x:nx*mag, y:ny*mag});
    });
  }

  // Duels: gently blend velocity toward "pointing back at the centre" each
  // frame. A pure force here (tried previously) conserves sideways
  // velocity, which can let two fighters settle into a stable orbit around
  // the centre rather than ever slowing down for a clean clash — a likely
  // cause of the reported glitchiness. Blending toward an inward velocity
  // kills that sideways drift over time, while a small blend factor still
  // lets a hard knockback carry a fighter out toward the wall first.
  function applyDuelSteering(){
    activeFighters.forEach(f=>{
      if(!f.alive || !f.body) return;
      const dx = CX - f.body.position.x, dy = CY - f.body.position.y;
      const dist = Math.hypot(dx,dy) || 1;
      const nx = dx/dist, ny = dy/dist;
      const desiredSpeed = 2.2;
      const blend = 0.03;
      const v = f.body.velocity;
      Body.setVelocity(f.body, {
        x: v.x + (nx*desiredSpeed - v.x)*blend,
        y: v.y + (ny*desiredSpeed - v.y)*blend
      });
    });
  }

  // =========================================================
  // UI HELPERS
  // =========================================================
  const bannerEl = document.getElementById('banner');
  const bannerText = document.getElementById('bannerText');
  const bannerSub = document.getElementById('bannerSub');
  function showBanner(text, sub, dur){
    bannerText.textContent = text; bannerSub.textContent = sub;
    bannerEl.classList.add('show');
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(()=> bannerEl.classList.remove('show'), dur||1300);
  }

  const stageValEl = document.getElementById('stageVal');
  const wcStageEl = document.getElementById('wcStage');
  const wcTagEl = document.getElementById('wcTag');
  const matchNumEl = document.getElementById('matchNum');
  const cupNumEl = document.getElementById('cupNum');
  const progressFillEl = document.getElementById('progressFill');

  let currentPhase = 'playin'; // 'playin' | 'bracket' | 'champion' — drives the World Cup panel's tagline
  function tagForPhase(){
    if(currentPhase === 'champion') return 'CHAMPION CROWNED ✓';
    if(currentPhase === 'bracket') return 'DUEL WINNERS ✓';
    return 'SUMO WINNERS ✓';
  }
  function setStage(t){
    stageValEl.textContent = t;
    wcStageEl.textContent = t.toUpperCase();
    wcTagEl.textContent = tagForPhase();
  }

  let matchIndex = 0, cupCount = 0;
  function bumpMatchIndex(){
    matchIndex++;
    matchNumEl.textContent = matchIndex + '/' + TOTAL_MATCHES;
    progressFillEl.style.width = Math.min(100, (matchIndex/TOTAL_MATCHES)*100) + '%';
  }

  function wait(ms){ return new Promise(r=> setTimeout(r, ms)); }
  function shuffle(arr){
    const a=[...arr];
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }
  function makePairs(arr){
    const s = shuffle(arr), pairs=[];
    for(let i=0;i<s.length;i+=2) pairs.push([s[i], s[i+1]]);
    return pairs;
  }
  const roundNameFor = n => ({32:'Round of 32',16:'Round of 16',8:'Quarterfinal',4:'Semifinal',2:'Final'}[n] || (n+' remain'));

  // ---- Panel rendering ----
  // "World Cup" panel: a rolling log of nations that have qualified/advanced
  // so far this tournament, most recent first.
  let qualifiedLog = [];
  function logQualified(fighters){
    qualifiedLog = qualifiedLog.concat(fighters);
    if(qualifiedLog.length > 40) qualifiedLog = qualifiedLog.slice(-40);
    renderWorldCup();
  }

  function refreshPanels(){ renderWorldCup(); renderContenders(); }

  function renderWorldCup(){
    const el = document.getElementById('worldCupList');
    if(qualifiedLog.length === 0){
      el.innerHTML = '<div style="font-size:10.5px;color:var(--mist);">No qualifiers yet.</div>';
      return;
    }
    const rows = [...qualifiedLog].reverse();
    el.innerHTML = rows.map(f=>`
      <div class="row-line">
        <img src="${f.iconSmall}" alt="">
        <div class="nm">${f.name}</div>
        <div class="chk">✓</div>
      </div>`).join('');
  }

  function renderContenders(){
    const alive = ALL_FIGHTERS.filter(f=> f.status !== 'eliminated');
    document.getElementById('contendersCount').textContent = alive.length;
    const el = document.getElementById('contendersList');
    el.innerHTML = alive.map((f,i)=>`
      <div class="row-line">
        <div class="rk">#${i+1}</div>
        <img src="${f.iconSmall}" alt="">
        <div class="nm">${f.name}</div>
      </div>`).join('');
  }

  // ---- Auto-scroll the two bottom panels (no manual scrolling needed) ----
  // Tracks scroll position ourselves and re-applies it every frame, rather
  // than trusting the browser to preserve scrollTop across the panels'
  // frequent content refreshes (which re-render every ~400ms during a
  // running match) — that's what made an earlier version look like it
  // wasn't scrolling at all.
  function initAutoScroll(){
    const els = Array.from(document.querySelectorAll('.panel-body'));
    const state = els.map(()=>({ pos: 0, paused: false }));
    function step(){
      els.forEach((el,i)=>{
        const s = state[i];
        const max = el.scrollHeight - el.clientHeight;
        if(max <= 2){ s.pos = 0; s.paused = false; return; }
        if(!s.paused){
          s.pos += 0.6;
          if(s.pos >= max){
            s.pos = max;
            s.paused = true;
            setTimeout(()=>{ s.pos = 0; s.paused = false; }, 900);
          }
        }
        el.scrollTop = s.pos;
      });
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // =========================================================
  // CANVAS RENDER
  // =========================================================
  const canvas = document.getElementById('arena');
  canvas.width = SIZE; canvas.height = SIZE;
  const ctx = canvas.getContext('2d');

  function drawArenaFloor(){
    // Soccer-pitch styled floor: green base, faint mowed stripes, a centre
    // circle and halfway line, then a glowing cyan ring with an inner
    // dashed track ring — clipped to the arena circle.
    ctx.save();
    ctx.beginPath(); ctx.arc(CX,CY,currentArenaR,0,Math.PI*2); ctx.closePath(); ctx.clip();

    ctx.fillStyle = '#2e7d35';
    ctx.fillRect(CX-currentArenaR, CY-currentArenaR, currentArenaR*2, currentArenaR*2);

    const stripes = 12, stripeW = (currentArenaR*2)/stripes;
    for(let i=0;i<stripes;i++){
      if(i%2===0){
        ctx.fillStyle = 'rgba(255,255,255,0.035)';
        ctx.fillRect(CX-currentArenaR + i*stripeW, CY-currentArenaR, stripeW, currentArenaR*2);
      }
    }

    const vgn = ctx.createRadialGradient(CX,CY,currentArenaR*0.25,CX,CY,currentArenaR);
    vgn.addColorStop(0,'rgba(0,0,0,0)');
    vgn.addColorStop(1,'rgba(0,0,0,0.4)');
    ctx.fillStyle = vgn;
    ctx.fillRect(CX-currentArenaR, CY-currentArenaR, currentArenaR*2, currentArenaR*2);

    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(CX, CY-currentArenaR); ctx.lineTo(CX, CY+currentArenaR); ctx.stroke();
    ctx.beginPath(); ctx.arc(CX,CY,currentArenaR*0.26,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(CX,CY,3,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.shadowColor = 'rgba(95,224,240,.65)'; ctx.shadowBlur = 16;
    ctx.strokeStyle = 'rgba(95,224,240,.95)'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(CX,CY,currentArenaR-2,0,Math.PI*2); ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = 'rgba(232,130,140,.55)'; ctx.lineWidth = 2;
    ctx.setLineDash([7,7]);
    ctx.beginPath(); ctx.arc(CX,CY,currentArenaR-11,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  function drawFighter(f){
    if(!f.body) return;
    const {x,y} = f.body.position, ang = f.body.angle, rr = currentFighterR;
    const hpFrac = Math.max(0, f.hp) / f.maxHp;
    ctx.save(); ctx.translate(x,y);
    if(f.flashT > 0){
      ctx.beginPath(); ctx.arc(0,0,rr+6,0,Math.PI*2);
      ctx.strokeStyle = `rgba(228,72,60,${f.flashT/0.15})`; ctx.lineWidth = 4; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0,0,rr+2,0,Math.PI*2); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();
    ctx.rotate(ang);
    ctx.beginPath(); ctx.arc(0,0,rr,0,Math.PI*2); ctx.closePath(); ctx.clip();
    if(f.img.complete && f.img.naturalWidth){
      ctx.drawImage(f.img, -rr, -rr*0.72, rr*2, rr*1.44);
    } else { ctx.fillStyle = '#334261'; ctx.fillRect(-rr,-rr,rr*2,rr*2); }
    ctx.restore();

    ctx.save(); ctx.translate(x,y);
    ctx.beginPath(); ctx.arc(0,0,rr,0,Math.PI*2); ctx.lineWidth = 2.5;
    ctx.strokeStyle = hpFrac>0.4 ? 'rgba(238,242,248,.75)' : 'rgba(228,72,60,.85)'; ctx.stroke();
    ctx.restore();

    ctx.save(); ctx.translate(x,y); ctx.rotate(-Math.PI/2);
    ctx.beginPath(); ctx.arc(0,0,rr+6,0, Math.PI*2*hpFrac);
    ctx.strokeStyle = hpFrac>0.4 ? '#3ecf8e' : '#e4483c'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();
    ctx.restore();
  }

  function drawParticles(dt){
    particles = particles.filter(p=>p.life>0);
    particles.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt*1.6;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*Math.max(0,p.life),0,Math.PI*2);
      ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0,p.life); ctx.fill(); ctx.globalAlpha = 1;
    });
  }

  let lastTime = performance.now();
  function loop(now){
    const dt = Math.min(0.033, (now-lastTime)/1000);
    lastTime = now;

    if(matchRunning){
      const isDuel = activeFighters.length === 2;
      if(isDuel) applyDuelSteering(); else applyCenterPull();
      Engine.update(engine, dt*1000);
      if(pendingKnockbacks.length){
        pendingKnockbacks.forEach(pk=>{
          Body.setVelocity(pk.bodyA, {
            x: pk.bodyA.velocity.x - pk.normal.x*pk.kb,
            y: pk.bodyA.velocity.y - pk.normal.y*pk.kb
          });
          Body.setVelocity(pk.bodyB, {
            x: pk.bodyB.velocity.x + pk.normal.x*pk.kb,
            y: pk.bodyB.velocity.y + pk.normal.y*pk.kb
          });
        });
        pendingKnockbacks = [];
      }
      activeFighters.forEach(f=>{
        if(!f.alive) return;
        if(isDuel) checkRingOut(f); else containFighter(f);
        if(f.flashT>0) f.flashT = Math.max(0, f.flashT-dt);
        if(f.hp <= 0){
          f.hp = 0; f.alive = false;
          const color = f.ringOut ? '#e8b94b' : '#e4483c';
          spawnBurst(f.body.position.x, f.body.position.y, color, 22);
          shake = Math.min(12, shake + (f.ringOut ? 7 : 4));
          sfxEliminate();
          f.removeBody();
          eliminationOrder.push(f);
        }
      });
      checkMatchEnd();
    }

    ctx.save(); ctx.clearRect(0,0,SIZE,SIZE);
    if(shake > 0.1){ ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake); shake *= 0.85; } else { shake = 0; }
    drawArenaFloor();
    activeFighters.forEach(drawFighter);
    drawParticles(dt);
    ctx.restore();

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // =========================================================
  // CONFETTI + CHAMPION OVERLAY
  // =========================================================
  function confettiBurst(){
    const overlay = document.getElementById('champOverlay');
    const colors = ['#e8b94b','#3ecf8e','#e4483c','#eef2f8'];
    for(let i=0;i<28;i++){
      const d = document.createElement('div');
      const c = colors[i % colors.length];
      d.style.cssText = `position:absolute; top:-10px; left:${Math.random()*100}%; width:6px; height:10px;
        background:${c}; opacity:.9; border-radius:2px;
        animation:fall ${1.4+Math.random()*1.2}s linear ${Math.random()*0.4}s forwards;`;
      overlay.appendChild(d);
      setTimeout(()=> d.remove(), 3000);
    }
  }

  async function crownChampion(fighter){
    fighter.champCount += 1; // shown as "championship #N" below
    fighter.status = 'champion';
    currentPhase = 'champion';
    refreshPanels();
    setStage('Champion');
    logQualified([fighter]);
    document.getElementById('champFlag').src = flagUrl(fighter.code,'w320');
    document.getElementById('champName').textContent = fighter.name;
    document.getElementById('champStat').textContent = 'Won ' + fighter.winCount + ' consecutive matches this tournament — championship #' + fighter.champCount + '.';
    document.getElementById('champOverlay').classList.remove('hidden');
    confettiBurst();
    sfxChampion();
    announce(`${fighter.name} are your Flag Arena world champions!`);
    await wait(6000);
    document.getElementById('champOverlay').classList.add('hidden');
  }

  // =========================================================
  // TOURNAMENT ORCHESTRATION
  // =========================================================
  function resetTournament(){
    ALL_FIGHTERS.forEach(f=> f.reset());
    qualifiedLog = [];
    activeFighters = [];
    particles = [];
    matchIndex = 0;
    matchNumEl.textContent = '0/' + TOTAL_MATCHES;
    progressFillEl.style.width = '0%';
    refreshPanels();
  }

  async function runPlayIns(){
    currentPhase = 'playin';
    setStage('Play-Ins');
    const qualifiers = [];
    for(let ci=0; ci<CONTINENTS.length; ci++){
      const cont = CONTINENTS[ci];
      const roster = cont.list.map(([code])=> registry[code]);
      bumpMatchIndex();
      refreshPanels();
      showBanner(cont.name.toUpperCase(), `Top ${cont.quota} Qualify`, 1500);
      sfxStart();
      announce(`${cont.name} play-in starting!`);
      await wait(1500);

      const survivors = await runMatch(roster, cont.quota);

      survivors.forEach(f=>{ f.winCount += 1; f.status = 'qualified'; });
      roster.filter(f=> !survivors.includes(f)).forEach(f=> f.status = 'eliminated');
      qualifiers.push(...survivors);
      logQualified(survivors);
      refreshPanels();
      showBanner(cont.quota + ' QUALIFIED', cont.name + ' Play-In Complete', 1700);
      sfxWin();
      announce(`${cont.name} play-in complete. ${survivors.length} nations qualify.`);
      await wait(1800);
    }
    return qualifiers;
  }

  async function runBracket(qualifiers){
    currentPhase = 'bracket';
    let roundFighters = shuffle(qualifiers);
    while(roundFighters.length > 1){
      const n = roundFighters.length;
      const name = roundNameFor(n);
      setStage(name);
      const pairs = makePairs(roundFighters);
      roundFighters.forEach(f=> f.status = 'qualified');
      refreshPanels();
      await wait(1400);

      const winners = [];
      for(let i=0;i<pairs.length;i++){
        const [a,b] = pairs[i];
        a.status = 'battling'; b.status = 'battling';
        bumpMatchIndex();
        refreshPanels();
        showBanner(a.name.toUpperCase() + ' VS ' + b.name.toUpperCase(), name, 1400);
        sfxStart();
        announce(`Next round: ${a.name} versus ${b.name}.`);
        await wait(1100);

        const survivors = await runMatch([a,b], 1);
        const winner = survivors[0] || a;
        const loser = winner === a ? b : a;
        winner.winCount += 1;
        winner.status = 'qualified';
        loser.status = 'eliminated';
        winners.push(winner);
        logQualified([winner]);
        refreshPanels();
        const ringOutWin = loser.ringOut;
        showBanner(winner.name.toUpperCase() + (ringOutWin ? ' — RING OUT!' : ' WINS'), name + ' Result', 1500);
        sfxWin();
        announce(ringOutWin
          ? `${winner.name} knocks ${loser.name} out of the arena!`
          : `${winner.name} defeats ${loser.name}.`);
        await wait(1600);
      }
      roundFighters = winners;
    }
    return roundFighters[0];
  }

  async function runFullTournament(){
    cupCount++;
    cupNumEl.textContent = cupCount;
    resetTournament();
    showBanner('WORLD CHAMPIONSHIP', 'Cup ' + cupCount, 1800);
    await wait(2000);
    const qualifiers = await runPlayIns();
    const champion = await runBracket(qualifiers);
    await crownChampion(champion);
  }

  async function runForever(){
    while(true){
      try{ await runFullTournament(); }
      catch(e){ console.error('Tournament error, restarting:', e); }
      await wait(2200);
    }
  }

  refreshPanels();
  runForever();
  initAutoScroll();

  // Force the arena to a true square in actual pixels. Relying on CSS
  // aspect-ratio inside a flex column worked in some environments but not
  // reliably across all browsers — this guarantees it everywhere and stays
  // correct across resizes, orientation changes, and the 9:16 frame scaling.
  function sizeArenaSquare(){
    const outer = document.querySelector('.arena-outer');
    const wrap = document.getElementById('arenaWrap');
    if(!outer || !wrap) return;
    const size = Math.max(0, Math.min(outer.clientWidth, outer.clientHeight));
    wrap.style.width = size + 'px';
    wrap.style.height = size + 'px';
  }
  window.addEventListener('resize', sizeArenaSquare);
  window.addEventListener('orientationchange', sizeArenaSquare);
  sizeArenaSquare();
  // One more pass after layout/fonts settle, in case the first measurement
  // happened before the frame had its final size.
  requestAnimationFrame(sizeArenaSquare);
  setTimeout(sizeArenaSquare, 300);

})();
</script>
