<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FLAG ARENA WORLD CHAMPIONSHIP — 24/7 Broadcast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  :root{
    --navy-0:#070c16; --navy-1:#0c1526; --navy-2:#131f36;
    --gold:#e8b94b; --gold-dim:#8a733a; --white:#eef2f8; --mist:#94a3c2;
    --red:#e4483c; --green:#3ecf8e; --shadow:rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background:
      radial-gradient(ellipse 1200px 600px at 50% -10%, rgba(232,185,75,.08), transparent 60%),
      radial-gradient(ellipse 900px 900px at 85% 110%, rgba(62,207,142,.05), transparent 55%),
      var(--navy-0);
    color:var(--white); font-family:'Inter',sans-serif; height:100%;
  }
  .display{font-family:'Teko',sans-serif; letter-spacing:.02em;}

  .shell{
    height:100%; max-width:1100px; margin:0 auto;
    display:flex; flex-direction:column; gap:7px;
    padding:8px 10px; overflow:hidden;
  }

  /* ---------- TOP BAR ---------- */
  .topbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; flex-shrink:0;
    padding:6px 12px; border-radius:10px;
    background:linear-gradient(180deg, var(--navy-2), var(--navy-1));
    border:1px solid #23324f; box-shadow:0 6px 18px var(--shadow);
  }
  .live-badge{
    display:flex; align-items:center; gap:5px; padding:3px 8px; border-radius:16px;
    background:rgba(228,72,60,.15); border:1px solid rgba(228,72,60,.5);
    font-size:9.5px; font-weight:800; letter-spacing:.1em; color:#ff8b7f; flex-shrink:0;
  }
  .live-dot{width:6px; height:6px; border-radius:50%; background:var(--red); animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
  .brand{font-size:12.5px; font-weight:700; text-transform:uppercase; color:var(--mist); white-space:nowrap;}
  .brand span{color:var(--gold);}

  .stat-boxes{display:flex; gap:6px; margin-left:auto;}
  .stat-box{
    text-align:center; padding:3px 12px; border-radius:7px; background:#0e1830; border:1px solid #23324f;
  }
  .stat-box .lbl{font-size:8.5px; color:var(--mist); letter-spacing:.1em; text-transform:uppercase;}
  .stat-box .val{font-family:'Teko',sans-serif; font-size:18px; font-weight:600; color:var(--gold); line-height:1.1; white-space:nowrap;}
  .sound-toggle{
    flex-shrink:0; width:28px; height:28px; border-radius:50%; margin-left:6px;
    background:#0e1830; border:1px solid #23324f; color:var(--gold); font-size:13px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .sound-toggle:active{transform:scale(.92);}

  /* ---------- PANELS ROW ---------- */
  .panels-row{display:flex; gap:7px; flex-shrink:0;}
  .mini-panel{
    flex:1; min-width:0; background:linear-gradient(180deg, var(--navy-2), var(--navy-1));
    border:1px solid #23324f; border-radius:10px; padding:7px 9px;
    display:flex; flex-direction:column; box-shadow:0 6px 16px var(--shadow);
  }
  .mp-head{display:flex; align-items:center; gap:5px; margin-bottom:5px; flex-shrink:0;}
  .mp-head h4{margin:0; font-family:'Teko',sans-serif; font-size:14px; font-weight:600; text-transform:uppercase; letter-spacing:.02em; white-space:nowrap;}
  .mp-tag{margin-left:auto; font-size:8.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
    padding:2px 6px; border-radius:9px; background:rgba(232,185,75,.15); color:var(--gold); white-space:nowrap;}
  .mp-body{overflow-y:auto; max-height:104px; font-size:10.5px;}
  .mp-body::-webkit-scrollbar{width:4px;}
  .mp-body::-webkit-scrollbar-thumb{background:#2b3c5c; border-radius:3px;}

  .row-line{display:flex; align-items:center; gap:5px; padding:3px 2px; border-bottom:1px solid #1c2a45;}
  .row-line:last-child{border-bottom:none;}
  .row-line img{width:15px; height:11px; object-fit:cover; border-radius:2px; flex-shrink:0;}
  .row-line .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row-line .nm.lose{opacity:.4; text-decoration:line-through;}
  .row-line .vs{color:var(--mist); font-size:9px; flex-shrink:0;}
  .row-line .tick{font-size:9.5px; flex-shrink:0; width:12px; text-align:center;}
  .row-line .qta{font-size:9px; color:var(--mist); flex-shrink:0;}
  .row-line .badge{font-size:9.5px; font-weight:800; color:#241a02; background:var(--gold); border-radius:5px; padding:1px 5px; flex-shrink:0;}
  .row-line .rk{width:12px; font-size:9.5px; color:var(--mist); font-weight:700; flex-shrink:0;}

  .alive-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(20px,1fr)); gap:3px;}
  .alive-grid img{width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:2px; box-shadow:0 0 0 1px #23324f;}

  /* ---------- MATCH TITLE ---------- */
  .match-title-wrap{text-align:center; flex-shrink:0;}
  .match-title{
    font-family:'Teko',sans-serif; font-weight:600; font-size:clamp(18px,3.4vw,32px);
    letter-spacing:.03em; text-transform:uppercase; line-height:1.05;
    background:linear-gradient(90deg,#eef2f8,var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .ticker{font-size:10.5px; color:var(--mist); min-height:13px; margin-top:1px;}

  /* ---------- ARENA ---------- */
  .arena-outer{flex:1; min-height:0; display:flex; align-items:center; justify-content:center;}
  .arena-wrap{
    position:relative; height:100%; width:auto; aspect-ratio:1/1; max-width:100%; max-height:100%;
    border-radius:20px; overflow:hidden;
    background:radial-gradient(circle at 50% 42%, #16233c 0%, #0d1729 55%, #070c16 100%);
    border:1px solid #23324f; box-shadow:0 16px 40px var(--shadow), inset 0 0 80px rgba(0,0,0,.6);
  }
  canvas{display:block; width:100%; height:100%;}

  .banner{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(.7);
    text-align:center; pointer-events:none; opacity:0; transition:opacity .25s ease, transform .25s ease; z-index:5;
  }
  .banner.show{opacity:1; transform:translate(-50%,-50%) scale(1);}
  .banner .display{font-size:clamp(28px,6vw,52px); font-weight:700; color:var(--white); text-transform:uppercase; text-shadow:0 6px 24px rgba(0,0,0,.6);}
  .banner .sub{font-size:11px; letter-spacing:.2em; color:var(--gold); text-transform:uppercase; margin-top:-6px;}

  .hype-badge{
    position:absolute; top:10px; right:10px; z-index:4; display:flex; align-items:center; gap:5px;
    background:rgba(7,12,22,.6); border:1px solid #2b3c5c; border-radius:16px; padding:4px 8px;
  }
  .hype-track{width:52px; height:5px; border-radius:4px; background:#0a1220; overflow:hidden;}
  .hype-fill{height:100%; width:0%; background:linear-gradient(90deg, var(--gold), var(--red)); transition:width .18s ease;}
  .hype-lbl{font-size:8px; color:var(--mist); letter-spacing:.06em; text-transform:uppercase;}

  .overlay{
    position:absolute; inset:0; z-index:10; background:rgba(7,12,22,.9); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .overlay.hidden{display:none;}
  .card{width:100%; max-width:420px; text-align:center;}
  .card h2{font-family:'Teko',sans-serif; font-size:clamp(28px,6vw,40px); font-weight:700; margin:0 0 4px; text-transform:uppercase;}
  .card p.lede{color:var(--mist); font-size:11.5px; margin:0 0 4px;}
  .champ-flag{width:110px; height:76px; object-fit:cover; border-radius:9px; margin:0 auto 12px;
    box-shadow:0 12px 34px rgba(0,0,0,.5), 0 0 0 4px var(--navy-2), 0 0 0 6px var(--gold);}

  @keyframes fall{to{transform:translateY(420px) rotate(360deg); opacity:0;}}

  @media (max-width:640px){
    .panels-row{flex-direction:row;}
    .mini-panel{padding:5px 6px;}
    .mp-body{max-height:80px;}
    .stat-box{padding:3px 7px;}
  }
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="live-badge"><div class="live-dot"></div>LIVE</div>
    <div class="brand">Flag<span>Arena</span> World Championship</div>
    <div class="stat-boxes">
      <div class="stat-box"><div class="lbl">Cup</div><div class="val" id="cupNum">1</div></div>
      <div class="stat-box"><div class="lbl">Stage</div><div class="val" id="stageVal" style="font-size:13px;">Loading</div></div>
      <div class="stat-box"><div class="lbl">Match</div><div class="val" id="matchNum">0/37</div></div>
    </div>
    <button id="soundToggle" class="sound-toggle" title="Toggle sound">🔊</button>
  </div>

  <div class="panels-row">
    <div class="mini-panel">
      <div class="mp-head"><h4>🏆 Schedule</h4><span class="mp-tag" id="scheduleTag">Play-In</span></div>
      <div class="mp-body" id="fixtureList"></div>
    </div>
    <div class="mini-panel">
      <div class="mp-head"><h4>🥇 Most Wins</h4><span class="mp-tag">All-Time</span></div>
      <div class="mp-body" id="winsList"></div>
    </div>
    <div class="mini-panel">
      <div class="mp-head"><h4>❌ Alive</h4><span class="mp-tag" id="aliveCount">88</span></div>
      <div class="mp-body"><div class="alive-grid" id="aliveGrid"></div></div>
    </div>
  </div>

  <div class="match-title-wrap">
    <div class="match-title" id="matchTitle">LOADING FLAGS…</div>
    <div class="ticker" id="tickerText">Preparing the world championship…</div>
  </div>

  <div class="arena-outer">
    <div class="arena-wrap" id="arenaWrap">
      <canvas id="arena"></canvas>
      <div class="hype-badge">
        <span class="hype-lbl">Hype</span>
        <div class="hype-track"><div class="hype-fill" id="hypeFill"></div></div>
      </div>
      <div class="banner" id="banner">
        <div class="display" id="bannerText">LOADING</div>
        <div class="sub" id="bannerSub">Please wait</div>
      </div>
      <div class="overlay hidden" id="champOverlay">
        <div class="card">
          <div class="sub" style="color:var(--gold); letter-spacing:.3em; font-size:11px; margin-bottom:8px;">WORLD CHAMPION</div>
          <img class="champ-flag" id="champFlag" src="" alt="">
          <h2 id="champName">—</h2>
          <p class="lede" id="champStat">—</p>
          <p class="lede">Next tournament begins shortly…</p>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  // =========================================================
  // DATA
  // =========================================================
  const CONTINENTS = [
    { name:'Africa', quota:7, list:[
      ['ng','Nigeria'],['eg','Egypt'],['za','South Africa'],['ke','Kenya'],['gh','Ghana'],
      ['ma','Morocco'],['dz','Algeria'],['et','Ethiopia'],['tz','Tanzania'],['ug','Uganda'],
      ['cm','Cameroon'],['ci','Ivory Coast'],['sn','Senegal'],['tn','Tunisia'],['ao','Angola'],
      ['mz','Mozambique'],['zm','Zambia'],['zw','Zimbabwe'],['rw','Rwanda'],['mg','Madagascar']
    ]},
    { name:'Asia', quota:7, list:[
      ['cn','China'],['in','India'],['jp','Japan'],['kr','South Korea'],['id','Indonesia'],
      ['sa','Saudi Arabia'],['ae','UAE'],['tr','Turkey'],['th','Thailand'],['vn','Vietnam'],
      ['ph','Philippines'],['pk','Pakistan'],['bd','Bangladesh'],['ir','Iran'],['iq','Iraq'],
      ['il','Israel'],['my','Malaysia'],['sg','Singapore'],['kz','Kazakhstan'],['mn','Mongolia']
    ]},
    { name:'Europe', quota:7, list:[
      ['de','Germany'],['fr','France'],['gb','United Kingdom'],['it','Italy'],['es','Spain'],
      ['nl','Netherlands'],['pt','Portugal'],['se','Sweden'],['no','Norway'],['dk','Denmark'],
      ['fi','Finland'],['pl','Poland'],['ch','Switzerland'],['at','Austria'],['be','Belgium'],
      ['ie','Ireland'],['gr','Greece'],['cz','Czechia'],['hu','Hungary'],['ro','Romania']
    ]},
    { name:'North America', quota:4, list:[
      ['us','USA'],['ca','Canada'],['mx','Mexico'],['cu','Cuba'],['jm','Jamaica'],
      ['cr','Costa Rica'],['pa','Panama'],['gt','Guatemala'],['hn','Honduras'],['do','Dominican Republic']
    ]},
    { name:'South America', quota:4, list:[
      ['br','Brazil'],['ar','Argentina'],['cl','Chile'],['co','Colombia'],['pe','Peru'],
      ['uy','Uruguay'],['ve','Venezuela'],['ec','Ecuador'],['py','Paraguay'],['bo','Bolivia']
    ]},
    { name:'Oceania', quota:3, list:[
      ['au','Australia'],['nz','New Zealand'],['fj','Fiji'],['pg','Papua New Guinea'],
      ['ws','Samoa'],['to','Tonga'],['vu','Vanuatu'],['sb','Solomon Islands']
    ]}
  ];
  const flagUrl = (code,size) => `https://flagcdn.com/${size||'w80'}/${code}.png`;
  const TOTAL_MATCHES = CONTINENTS.length + 31; // 6 play-ins + 31 bracket matches
  const MAX_HP = 300; // 3x the original pool so play-ins last well beyond a few seconds

  // =========================================================
  // FIGHTER REGISTRY
  // =========================================================
  function Fighter(code, name, continent){
    this.code = code; this.name = name; this.continent = continent;
    this.img = new Image(); this.img.crossOrigin = 'anonymous'; this.img.src = flagUrl(code,'w160');
    this.iconSmall = flagUrl(code,'w40');
    this.hp = MAX_HP; this.alive = true; this.status = 'idle';
    this.winCount = 0; this.flashT = 0; this.body = null;
  }
  Fighter.prototype.reset = function(){
    this.hp = MAX_HP; this.alive = true; this.status = 'idle'; this.winCount = 0; this.flashT = 0; this.body = null;
  };
  Fighter.prototype.spawnBody = function(x,y){
    this.hp = MAX_HP; this.alive = true; this.flashT = 0;
    const angle = Math.random()*Math.PI*2, speed = 2.6 + Math.random()*2.2;
    this.body = Bodies.circle(x, y, currentFighterR, {
      restitution:0.9, friction:0.001, frictionAir:0.0018, density:0.002,
      label:'fighter:'+this.code
    });
    Body.setVelocity(this.body, {x:Math.cos(angle)*speed, y:Math.sin(angle)*speed});
    Body.setAngularVelocity(this.body, (Math.random()-0.5)*0.08);
    World.add(engine.world, this.body);
  };
  Fighter.prototype.removeBody = function(){
    if(this.body){ World.remove(engine.world, this.body); this.body = null; }
  };

  const registry = {};
  CONTINENTS.forEach(cont=>{
    cont.list.forEach(([code,name])=>{ registry[code] = new Fighter(code, name, cont.name); });
  });
  const ALL_FIGHTERS = Object.values(registry);

  // =========================================================
  // SOUND — procedural SFX (Web Audio) + announcer voice (Speech Synthesis)
  // Both are generated in-browser, so no audio files need to be hosted.
  // =========================================================
  let soundOn = true;
  let audioCtx = null;
  function getCtx(){
    if(!window.AudioContext && !window.webkitAudioContext) return null;
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    return audioCtx;
  }
  function tone(freq, dur, type, gain, delay, endFreq){
    if(!soundOn) return;
    const ctx = getCtx(); if(!ctx) return;
    if(ctx.state === 'suspended') ctx.resume();
    const t0 = ctx.currentTime + (delay||0);
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if(endFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(1,endFreq), t0+dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(gain||0.15, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+dur+0.03);
  }
  let lastHitSfx = 0;
  function sfxHit(){
    const now = performance.now();
    if(now - lastHitSfx < 90) return; // throttle so crowded rumbles don't wall-of-noise
    lastHitSfx = now;
    tone(120+Math.random()*50, 0.06, 'square', 0.07);
  }
  function sfxEliminate(){ tone(420, 0.26, 'sawtooth', 0.11, 0, 90); }
  function sfxStart(){ tone(440,0.1,'sine',0.09); tone(660,0.12,'sine',0.09,0.1); }
  function sfxWin(){ tone(660,0.1,'triangle',0.11); tone(880,0.16,'triangle',0.11,0.1); }
  function sfxChampion(){
    tone(523,0.16,'triangle',0.13); tone(659,0.16,'triangle',0.13,0.16);
    tone(784,0.16,'triangle',0.13,0.32); tone(1046,0.34,'triangle',0.15,0.48);
  }

  // ---- Announcer voice ----
  let voices = [], chosenVoice = null, unlockedSpeech = false;
  const speechSupported = 'speechSynthesis' in window;
  function loadVoices(){
    if(!speechSupported) return;
    voices = speechSynthesis.getVoices();
    if(voices.length) chosenVoice = voices.find(v=>/en-?(US|GB)/i.test(v.lang)) || voices[0];
  }
  if(speechSupported){
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }
  let speechQueue = [], isSpeaking = false;
  function pumpSpeechQueue(){
    if(!speechSupported || isSpeaking || speechQueue.length===0) return;
    const text = speechQueue.shift();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.05; u.pitch = 0.92; u.volume = 1;
    if(chosenVoice) u.voice = chosenVoice;
    u.onend = ()=>{ isSpeaking=false; pumpSpeechQueue(); };
    u.onerror = ()=>{ isSpeaking=false; pumpSpeechQueue(); };
    isSpeaking = true;
    speechSynthesis.speak(u);
  }
  function announce(text){
    if(!soundOn || !speechSupported) return;
    speechQueue.push(text);
    if(speechQueue.length > 3) speechQueue.shift(); // don't let a backlog build up and lag behind the action
    pumpSpeechQueue();
  }

  function unlockAudio(){
    try{ const ctx = getCtx(); if(ctx && ctx.state==='suspended') ctx.resume(); }catch(e){}
    try{
      if(speechSupported && !unlockedSpeech){
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0;
        speechSynthesis.speak(u);
        unlockedSpeech = true;
      }
    }catch(e){}
  }
  document.addEventListener('pointerdown', function onFirstInteract(){
    unlockAudio();
    document.removeEventListener('pointerdown', onFirstInteract);
  }, {once:true});

  const soundToggleBtn = document.getElementById('soundToggle');
  soundToggleBtn.addEventListener('click', ()=>{
    soundOn = !soundOn;
    soundToggleBtn.textContent = soundOn ? '🔊' : '🔇';
    if(!soundOn){
      if(speechSupported) speechSynthesis.cancel();
      speechQueue = []; isSpeaking = false;
    } else {
      unlockAudio();
    }
  });

  // =========================================================
  // MATTER.JS SETUP  (no wall bodies — boundary handled manually each frame)
  // =========================================================
  const { Engine, World, Bodies, Body, Vector } = Matter;
  const engine = Engine.create();
  engine.world.gravity.x = 0; engine.world.gravity.y = 0;

  const SIZE = 800, CX = 400, CY = 400;
  let currentArenaR = 300, currentFighterR = 34;

  function arenaRadiusFor(n){ return Math.round(Math.min(372, 210 + n*8)); }
  function fighterRadiusFor(n){ return Math.round(Math.max(16, 46 - Math.max(0,n-2)*1.15)); }

  function setupArenaFor(n){
    currentArenaR = arenaRadiusFor(n);
    currentFighterR = fighterRadiusFor(n);
  }

  function spawnRing(list){
    const n = list.length;
    list.forEach((f,i)=>{
      const a = (i/n) * Math.PI*2 + (Math.random()-0.5)*0.2;
      const rad = currentArenaR * (0.4 + Math.random()*0.25);
      f.status = 'battling';
      f.spawnBody(CX + Math.cos(a)*rad, CY + Math.sin(a)*rad);
    });
  }

  // Perfect circular boundary: reflect any fighter that pushes past the edge.
  // Position is nudged slightly *inside* the true edge (buffer) so a fighter
  // getting jostled by neighbours right at the wall doesn't re-trigger the
  // bounce every frame and appear "stuck".
  function containFighter(f){
    if(!f.body || !f.alive) return;
    const p = f.body.position;
    const dx = p.x - CX, dy = p.y - CY;
    const dist = Math.hypot(dx,dy) || 0.0001;
    const maxDist = currentArenaR - currentFighterR;
    if(dist > maxDist){
      const nx = dx/dist, ny = dy/dist;
      const inset = maxDist - 3;
      Body.setPosition(f.body, {x: CX + nx*inset, y: CY + ny*inset});
      const v = f.body.velocity;
      const dot = v.x*nx + v.y*ny;
      const rest = 0.9;
      // Always send it back inward with a minimum kick, even if it arrived
      // nearly at rest (e.g. after being pinned by neighbours).
      const inward = Math.max(1.5, (1+rest)*dot);
      Body.setVelocity(f.body, {x: v.x - inward*nx, y: v.y - inward*ny});
      spawnBurst(f.body.position.x, f.body.position.y, '#3ecf8e', 4);
      shake = Math.min(6, shake + 1.2);
    }
  }

  // =========================================================
  // MATCH RUNNER
  // =========================================================
  let activeFighters = [];
  let matchRunning = false;
  let matchTargetRemaining = 1;
  let matchResolve = null;
  let particles = [];
  let shake = 0;
  let hype = 0;

  function runMatch(list, targetRemaining){
    return new Promise(resolve=>{
      activeFighters = list;
      matchTargetRemaining = targetRemaining;
      setupArenaFor(list.length);
      spawnRing(list);
      matchRunning = true;
      matchResolve = resolve;
      refreshPanels();
    });
  }

  function fighterFromBody(body){
    if(!body.label || body.label.indexOf('fighter:') !== 0) return null;
    const code = body.label.split(':')[1];
    const f = registry[code];
    return (f && f.body === body) ? f : null;
  }

  Matter.Events.on(engine, 'collisionStart', (event)=>{
    event.pairs.forEach(pair=>{
      const fa = fighterFromBody(pair.bodyA), fb = fighterFromBody(pair.bodyB);
      if(fa && fb){
        const rv = Vector.sub(pair.bodyA.velocity, pair.bodyB.velocity);
        const speed = Vector.magnitude(rv);
        const dmg = Math.max(3, Math.min(36, speed * 2.1));
        fa.hp -= dmg; fb.hp -= dmg;
        fa.flashT = 0.15; fb.flashT = 0.15;
        hype = Math.min(100, hype + 3);
        const mid = Vector.add(pair.bodyA.position, Vector.mult(Vector.sub(pair.bodyB.position,pair.bodyA.position), 0.5));
        spawnBurst(mid.x, mid.y, '#ffffff', Math.min(14, 4+speed));
        shake = Math.min(10, shake + speed*0.3);
        sfxHit();
      }
    });
  });

  function spawnBurst(x,y,color,n){
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, s = 1+Math.random()*4;
      particles.push({x,y,vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, color, r:1.5+Math.random()*2.5});
    }
  }

  function checkMatchEnd(){
    if(!matchRunning) return;
    const alive = activeFighters.filter(f=>f.alive);
    if(alive.length <= matchTargetRemaining){
      matchRunning = false;
      const resolve = matchResolve; matchResolve = null;
      if(resolve) resolve(alive);
    }
  }

  // Every fighter gets a gentle, continuous pull back toward the arena centre.
  // This keeps play-in rumbles from piling up against the wall (which is what
  // caused the "stuck" look) and keeps 1v1 duels centred in frame. It's weak
  // enough that collisions and bounces still dominate the motion.
  function applyCenterPull(){
    const n = activeFighters.length;
    activeFighters.forEach(f=>{
      if(!f.alive || !f.body) return;
      const dx = CX - f.body.position.x, dy = CY - f.body.position.y;
      const dist = Math.hypot(dx,dy) || 1;
      const nx = dx/dist, ny = dy/dist;
      // Stronger pull the closer to the wall it is; a touch weaker overall
      // for big rosters so the rumble still has room to spread out.
      const edgeZone = dist > currentArenaR*0.55;
      const base = n <= 2 ? 0.0020 : 0.0011;
      const mag = edgeZone ? base : base*0.2;
      Body.applyForce(f.body, f.body.position, {x:nx*mag, y:ny*mag});
    });
  }

  // =========================================================
  // UI HELPERS
  // =========================================================
  const bannerEl = document.getElementById('banner');
  const bannerText = document.getElementById('bannerText');
  const bannerSub = document.getElementById('bannerSub');
  function showBanner(text, sub, dur){
    bannerText.textContent = text; bannerSub.textContent = sub;
    bannerEl.classList.add('show');
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(()=> bannerEl.classList.remove('show'), dur||1300);
  }

  const stageValEl = document.getElementById('stageVal');
  const matchNumEl = document.getElementById('matchNum');
  const cupNumEl = document.getElementById('cupNum');
  const matchTitleEl = document.getElementById('matchTitle');
  const tickerEl = document.getElementById('tickerText');
  function setStage(t){ stageValEl.textContent = t; }
  function setMatchTitle(t){ matchTitleEl.textContent = t; }
  function logTicker(t){ tickerEl.textContent = t; }

  let matchIndex = 0, cupCount = 0;
  function bumpMatchIndex(){ matchIndex++; matchNumEl.textContent = matchIndex + '/' + TOTAL_MATCHES; }

  function wait(ms){ return new Promise(r=> setTimeout(r, ms)); }
  function shuffle(arr){
    const a=[...arr];
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }
  function makePairs(arr){
    const s = shuffle(arr), pairs=[];
    for(let i=0;i<s.length;i+=2) pairs.push([s[i], s[i+1]]);
    return pairs;
  }
  const roundNameFor = n => ({32:'Round of 32',16:'Round of 16',8:'Quarterfinal',4:'Semifinal',2:'Final'}[n] || (n+' remain'));

  // ---- Panel rendering ----
  let fixtureMode = 'playin';
  let continentStatus = CONTINENTS.map(c=>({...c, status:'upcoming', remain:c.list.length}));
  let currentFixtures = [];

  function refreshPanels(){ renderWins(); renderAlive(); renderFixtures(); }

  function renderWins(){
    const top = [...ALL_FIGHTERS].filter(f=>f.winCount>0).sort((a,b)=>b.winCount-a.winCount).slice(0,10);
    const el = document.getElementById('winsList');
    if(top.length === 0){ el.innerHTML = '<div style="font-size:10.5px;color:var(--mist);">No wins yet.</div>'; return; }
    el.innerHTML = top.map((f,i)=>`
      <div class="row-line">
        <div class="rk">${i+1}</div>
        <img src="${f.iconSmall}" alt="">
        <div class="nm">${f.name}</div>
        <div class="badge">${f.winCount}</div>
      </div>`).join('');
  }

  function renderAlive(){
    const alive = ALL_FIGHTERS.filter(f=> f.status !== 'eliminated');
    document.getElementById('aliveCount').textContent = alive.length;
    document.getElementById('aliveGrid').innerHTML = alive.map(f=>
      `<img src="${f.iconSmall}" title="${f.name}" alt="${f.name}">`
    ).join('');
  }

  function renderFixtures(){
    const tagEl = document.getElementById('scheduleTag');
    const listEl = document.getElementById('fixtureList');
    if(fixtureMode === 'playin'){
      tagEl.textContent = 'Play-In';
      listEl.innerHTML = continentStatus.map(c=>{
        const icon = c.status==='done' ? '✅' : (c.status==='live' ? '🔴' : '⏳');
        return `<div class="row-line">
          <div class="nm">${c.name}</div>
          <div class="qta">${c.status==='upcoming' ? c.list.length+'→'+c.quota : c.remain+'→'+c.quota}</div>
          <div class="tick">${icon}</div>
        </div>`;
      }).join('');
    } else {
      tagEl.textContent = currentFixtures.length ? roundNameFor(currentFixtures.length*2) : 'Bracket';
      listEl.innerHTML = currentFixtures.map(fx=>{
        const icon = fx.status==='done' ? '✅' : (fx.status==='live' ? '🔴' : '⏳');
        const aLose = fx.winner && fx.winner!==fx.a ? 'lose' : '';
        const bLose = fx.winner && fx.winner!==fx.b ? 'lose' : '';
        return `<div class="row-line">
          <img src="${fx.a.iconSmall}"><div class="nm ${aLose}">${fx.a.name}</div>
          <div class="vs">vs</div>
          <div class="nm ${bLose}" style="text-align:right;">${fx.b.name}</div><img src="${fx.b.iconSmall}">
          <div class="tick">${icon}</div>
        </div>`;
      }).join('');
    }
  }

  // =========================================================
  // CANVAS RENDER
  // =========================================================
  const canvas = document.getElementById('arena');
  canvas.width = SIZE; canvas.height = SIZE;
  const ctx = canvas.getContext('2d');

  function drawArenaFloor(){
    ctx.save();
    ctx.beginPath(); ctx.arc(CX,CY,currentArenaR,0,Math.PI*2); ctx.closePath();
    const grad = ctx.createRadialGradient(CX,CY,10,CX,CY,currentArenaR);
    grad.addColorStop(0,'#1c2c4a'); grad.addColorStop(0.7,'#12203a'); grad.addColorStop(1,'#0a1220');
    ctx.fillStyle = grad; ctx.fill(); ctx.restore();

    ctx.save();
    ctx.strokeStyle = 'rgba(232,185,75,.22)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(CX,CY,currentArenaR,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle = 'rgba(148,163,194,.12)';
    ctx.beginPath(); ctx.arc(CX,CY,currentArenaR*0.62,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(CX,CY,currentArenaR*0.28,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  function drawFighter(f){
    if(!f.body) return;
    const {x,y} = f.body.position, ang = f.body.angle, rr = currentFighterR;
    const hpFrac = Math.max(0, f.hp) / MAX_HP;
    ctx.save(); ctx.translate(x,y);
    if(f.flashT > 0){
      ctx.beginPath(); ctx.arc(0,0,rr+6,0,Math.PI*2);
      ctx.strokeStyle = `rgba(228,72,60,${f.flashT/0.15})`; ctx.lineWidth = 4; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0,0,rr+2,0,Math.PI*2); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();
    ctx.rotate(ang);
    ctx.beginPath(); ctx.arc(0,0,rr,0,Math.PI*2); ctx.closePath(); ctx.clip();
    if(f.img.complete && f.img.naturalWidth){
      ctx.drawImage(f.img, -rr, -rr*0.72, rr*2, rr*1.44);
    } else { ctx.fillStyle = '#334261'; ctx.fillRect(-rr,-rr,rr*2,rr*2); }
    ctx.restore();

    ctx.save(); ctx.translate(x,y);
    ctx.beginPath(); ctx.arc(0,0,rr,0,Math.PI*2); ctx.lineWidth = 2.5;
    ctx.strokeStyle = hpFrac>0.4 ? 'rgba(238,242,248,.55)' : 'rgba(228,72,60,.85)'; ctx.stroke();
    ctx.restore();

    ctx.save(); ctx.translate(x,y); ctx.rotate(-Math.PI/2);
    ctx.beginPath(); ctx.arc(0,0,rr+6,0, Math.PI*2*hpFrac);
    ctx.strokeStyle = hpFrac>0.4 ? '#3ecf8e' : '#e4483c'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();
    ctx.restore();
  }

  function drawParticles(dt){
    particles = particles.filter(p=>p.life>0);
    particles.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt*1.6;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*Math.max(0,p.life),0,Math.PI*2);
      ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0,p.life); ctx.fill(); ctx.globalAlpha = 1;
    });
  }

  let lastTime = performance.now();
  function loop(now){
    const dt = Math.min(0.033, (now-lastTime)/1000);
    lastTime = now;

    if(matchRunning){
      applyCenterPull();
      Engine.update(engine, dt*1000);
      activeFighters.forEach(f=>{
        if(!f.alive) return;
        containFighter(f);
        if(f.flashT>0) f.flashT = Math.max(0, f.flashT-dt);
        if(f.hp <= 0){
          f.hp = 0; f.alive = false;
          spawnBurst(f.body.position.x, f.body.position.y, '#e4483c', 22);
          shake = Math.min(12, shake+4);
          sfxEliminate();
          f.removeBody();
        }
      });
      checkMatchEnd();
    }
    hype = Math.max(0, hype - dt*4);
    document.getElementById('hypeFill').style.width = hype + '%';

    ctx.save(); ctx.clearRect(0,0,SIZE,SIZE);
    if(shake > 0.1){ ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake); shake *= 0.85; } else { shake = 0; }
    drawArenaFloor();
    activeFighters.forEach(drawFighter);
    drawParticles(dt);
    ctx.restore();

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // =========================================================
  // CONFETTI + CHAMPION OVERLAY
  // =========================================================
  function confettiBurst(){
    const overlay = document.getElementById('champOverlay');
    const colors = ['#e8b94b','#3ecf8e','#e4483c','#eef2f8'];
    for(let i=0;i<28;i++){
      const d = document.createElement('div');
      const c = colors[i % colors.length];
      d.style.cssText = `position:absolute; top:-10px; left:${Math.random()*100}%; width:6px; height:10px;
        background:${c}; opacity:.9; border-radius:2px;
        animation:fall ${1.4+Math.random()*1.2}s linear ${Math.random()*0.4}s forwards;`;
      overlay.appendChild(d);
      setTimeout(()=> d.remove(), 3000);
    }
  }

  async function crownChampion(fighter){
    fighter.status = 'champion';
    refreshPanels();
    setStage('Champion');
    setMatchTitle('🏆 ' + fighter.name.toUpperCase() + ' — WORLD CHAMPION');
    logTicker(fighter.name + ' conquered all 88 nations to win the Flag Arena World Championship!');
    document.getElementById('champFlag').src = flagUrl(fighter.code,'w320');
    document.getElementById('champName').textContent = fighter.name;
    document.getElementById('champStat').textContent = 'Won ' + fighter.winCount + ' consecutive matches this tournament.';
    document.getElementById('champOverlay').classList.remove('hidden');
    confettiBurst();
    sfxChampion();
    announce(`${fighter.name} are your Flag Arena world champions!`);
    await wait(6000);
    document.getElementById('champOverlay').classList.add('hidden');
  }

  // =========================================================
  // TOURNAMENT ORCHESTRATION
  // =========================================================
  function resetTournament(){
    ALL_FIGHTERS.forEach(f=> f.reset());
    continentStatus = CONTINENTS.map(c=>({...c, status:'upcoming', remain:c.list.length}));
    currentFixtures = [];
    fixtureMode = 'playin';
    activeFighters = [];
    particles = [];
    matchIndex = 0;
    matchNumEl.textContent = '0/' + TOTAL_MATCHES;
    refreshPanels();
  }

  async function runPlayIns(){
    fixtureMode = 'playin';
    setStage('Play-Ins');
    const qualifiers = [];
    for(let ci=0; ci<CONTINENTS.length; ci++){
      const cont = CONTINENTS[ci];
      const roster = cont.list.map(([code])=> registry[code]);
      continentStatus[ci].status = 'live';
      continentStatus[ci].remain = roster.length;
      bumpMatchIndex();
      refreshPanels();
      setMatchTitle(cont.name.toUpperCase() + ' PLAY-IN');
      logTicker(`${cont.name} Play-In starting — ${roster.length} nations battle for ${cont.quota} spots.`);
      showBanner(cont.name.toUpperCase(), `Top ${cont.quota} Qualify`, 1500);
      sfxStart();
      announce(`${cont.name} play-in starting!`);
      await wait(1500);

      const remainTimer = setInterval(()=>{
        continentStatus[ci].remain = roster.filter(f=>f.alive).length;
        renderFixtures();
      }, 350);

      const survivors = await runMatch(roster, cont.quota);
      clearInterval(remainTimer);

      survivors.forEach(f=>{ f.winCount += 1; f.status = 'qualified'; });
      roster.filter(f=> !survivors.includes(f)).forEach(f=> f.status = 'eliminated');
      continentStatus[ci].status = 'done';
      continentStatus[ci].remain = cont.quota;
      qualifiers.push(...survivors);
      refreshPanels();
      logTicker(`${cont.name} complete — qualified: ${survivors.map(s=>s.name).join(', ')}`);
      showBanner(cont.quota + ' QUALIFIED', cont.name + ' Play-In Complete', 1700);
      sfxWin();
      announce(`${cont.name} play-in complete. ${survivors.length} nations qualify.`);
      await wait(1800);
    }
    return qualifiers;
  }

  async function runBracket(qualifiers){
    fixtureMode = 'bracket';
    let roundFighters = shuffle(qualifiers);
    while(roundFighters.length > 1){
      const n = roundFighters.length;
      const name = roundNameFor(n);
      setStage(name);
      const pairs = makePairs(roundFighters);
      currentFixtures = pairs.map(([a,b])=>({a,b,status:'upcoming',winner:null}));
      roundFighters.forEach(f=> f.status = 'qualified');
      refreshPanels();
      setMatchTitle(name.toUpperCase() + ' DRAWN');
      logTicker(`${name} bracket set — ${pairs.length} ${pairs.length===1?'match':'matches'} to decide the next round.`);
      await wait(1400);

      const winners = [];
      for(let i=0;i<pairs.length;i++){
        const [a,b] = pairs[i];
        currentFixtures[i].status = 'live';
        a.status = 'battling'; b.status = 'battling';
        bumpMatchIndex();
        refreshPanels();
        setMatchTitle(a.name.toUpperCase() + ' ⚔ ' + b.name.toUpperCase());
        showBanner(a.name.toUpperCase() + ' VS ' + b.name.toUpperCase(), name, 1400);
        sfxStart();
        announce(`Next round: ${a.name} versus ${b.name}.`);
        await wait(1100);

        const survivors = await runMatch([a,b], 1);
        const winner = survivors[0] || a;
        const loser = winner === a ? b : a;
        winner.winCount += 1;
        winner.status = 'qualified';
        loser.status = 'eliminated';
        currentFixtures[i].status = 'done';
        currentFixtures[i].winner = winner;
        winners.push(winner);
        refreshPanels();
        showBanner(winner.name.toUpperCase() + ' WINS', name + ' Result', 1500);
        logTicker(`${winner.name} defeats ${loser.name} in the ${name}.`);
        sfxWin();
        announce(`${winner.name} defeats ${loser.name}.`);
        await wait(1600);
      }
      roundFighters = winners;
    }
    return roundFighters[0];
  }

  async function runFullTournament(){
    cupCount++;
    cupNumEl.textContent = cupCount;
    resetTournament();
    setMatchTitle('NEW TOURNAMENT BEGINNING');
    logTicker('A new Flag Arena World Championship begins — 88 nations, 6 continents, one champion.');
    showBanner('WORLD CHAMPIONSHIP', 'Cup ' + cupCount, 1800);
    await wait(2000);
    const qualifiers = await runPlayIns();
    const champion = await runBracket(qualifiers);
    await crownChampion(champion);
  }

  async function runForever(){
    while(true){
      try{ await runFullTournament(); }
      catch(e){ console.error('Tournament error, restarting:', e); }
      await wait(2200);
    }
  }

  refreshPanels();
  runForever();

})();
</script>
</body>
